<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIS Connector · 安装教程</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="ssh.css"></head><body>
<header><img class="mark" src="assets/icon-128.png" alt="AIS Connector"><div><h1>安装教程</h1><small>Windows / macOS</small></div></header>
<main><div id="platformGuides"></div><section><h2>安装后使用</h2><p>重新打开侧边栏，选择用户 → 登录认证 → 初始化连接 → 复制 SSH 命令。已有隧道可在关闭浏览器后继续运行。</p><p>需预先通过公司批准的渠道安装 ssctl，并连接所需办公网络。</p><p>macOS 适配尚未经过 Mac 实机验证。首次登录可能提示允许访问钥匙串，请按系统提示操作。</p><p>手动 ssctl 命令使用默认凭据，与扩展按用户隔离的凭据不同。</p></section></main><script src="guide.js"></script></body></html>
