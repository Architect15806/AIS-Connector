<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIS Connector</title><link rel="stylesheet" href="panel.css"></head>
<body>
<header><img class="mark" src="assets/icon-128.png" alt="AIS Connector Logo"><div><h1>AIS Connector</h1><small>AIStudio · SSH 工作空间</small></div><div class="service-actions"><span id="bridge" class="badge">检测中</span><button id="installTutorial">安装教程</button></div></header>
<main>
<section><h2 id="currentUser" class="current-user">当前用户：未登录</h2><div class="user-selector"><select id="users" aria-label="选择用户"></select><button id="addUser" class="quiet user-icon" aria-label="添加用户" title="添加用户">+</button><button id="deleteUser" class="quiet user-icon" aria-label="删除用户" title="删除用户"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></svg></button><button id="login">登录</button></div><p id="auth" class="hint"></p></section>
<section><div class="heading"><h2>我的连接</h2><div class="connection-heading-actions"><button id="refreshAll">全部刷新</button><button id="toggleAll" class="quiet" title="全部展开" aria-label="全部展开">▸</button><button id="addConnection" class="quiet" title="添加连接" aria-label="添加连接">+</button></div></div><div id="connections"></div></section>
<aside id="message" role="status" aria-live="polite">正在连接本地服务…</aside>
<nav class="bottom-actions" aria-label="工具"><button id="agentConnection" class="quiet">Agent 连接</button><button id="openHome" class="quiet">居家</button><button id="openLogs" class="quiet">日志</button><button id="openSettings" class="quiet">设置</button></nav>
</main>
<dialog id="settingsDialog"><form id="settingsForm"><h2>连接检测设置</h2><label>检测间隔（分钟）<input id="checkInterval" type="number" min="0.1" max="1440" step="0.1" value="5" required></label><p class="hint">连接成功后在后台执行 SSH 检测。失败时尝试重连；重连失败则按此间隔继续重试。关闭侧边栏仍然生效。</p><p id="settingsError" class="hint" role="alert"></p><div class="row"><button id="cancelSettings" type="button" class="quiet">取消</button><button type="submit">保存</button></div></form></dialog>
<dialog id="editor"><form id="editorForm"><h2 id="editorTitle"></h2><p id="userHelp" class="hint" hidden>用户名填写邮箱的 @ 前缀。例如 example.user@example.com 对应的用户名是 example.user，不要填写完整邮箱。</p><label id="field1Label">名称<input id="field1" required maxlength="120"></label><label id="field2Label" hidden>AIS Namespace<input id="field2" pattern="workflow_[0-9]+"></label><div id="namespaceHelp" hidden><p class="hint">在 Web IDE 中执行以下命令获取 namespace：</p><div class="ssh-line"><code>echo $AISTUDIO_NAMESPACE</code><button type="button" class="copy-button" id="copyNamespace" aria-label="复制 namespace 查询命令" title="复制命令">⧉</button></div></div><div class="row"><button type="button" id="cancelEditor" class="quiet">取消</button><button type="submit">保存</button></div></form></dialog>
<dialog id="loginDialog"><form id="loginForm"><h2>登录认证</h2><p id="loginName"></p><label>六位 Alilang Token<input id="token" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" spellcheck="false" required></label><p class="hint">Token 仅用于本次认证，不会保存。</p><div class="row"><button type="button" id="cancelLogin" class="quiet">取消</button><button type="submit">认证</button></div></form></dialog>
<link rel="stylesheet" href="ssh.css"><script src="panel.js"></script></body></html>
